<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarif 595 PDF Generator</title>
  <link rel="stylesheet" href="/static/pico.min.css">
</head>
<body>
  <main class="container">
    <h2>Tarif 595 Generator</h2>
    <p>Fill out the form below to generate and download the PDF invoice directly.</p>

    <form action="/form/generate-pdf" method="post">
      <fieldset>
        <legend>Company</legend>
        <div class="grid">
          <input type="text" name="company_name" placeholder="Company Name" value="Praxis Dr. Muster" required>
          <input type="text" name="company_address" placeholder="Address" value="Bahnhofstrasse 1, 8001 Zürich" required>
          <input type="text" name="company_iban" placeholder="IBAN" value="CH9300762011623852957" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Client</legend>
        <div class="grid">
          <input type="text" name="client_first_name" placeholder="First Name" value="Hans" required>
          <input type="text" name="client_last_name" placeholder="Last Name" value="Muster" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Service</legend>
        <div class="grid">
          <input type="date" name="service_date" value="2026-09-22" required>
          <input type="text" name="service_description" placeholder="Description" value="Tarif 595 Consultation" required>
          <input type="number" step="0.05" name="service_amount" placeholder="Amount" value="120.00" required>
        </div>
      </fieldset>

      <button type="submit">Download PDF</button>
    </form>

    <p><small>For developers: interactive API docs are available at <a href="/docs">/docs</a>.</small></p>
  </main>
</body>
</html>
