<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %}</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 12mm 12mm 15mm 12mm;
      }

      body {
        font-family: Arial, "Helvetica Neue", sans-serif;
        font-size: 8pt;
        color: #000;
        margin: 0;
        padding: 0;
      }

      /* Top banner */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2mm;
      }

      .title-banner {
        font-size: 16pt;
        font-weight: bold;
        margin: 0;
        padding: 0;
      }

      .top-right {
        display: flex;
        align-items: stretch;
        gap: 3mm;
      }

      .release-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: right;
        font-size: 7.5pt;
        padding-right: 2mm;
      }

      .release-divider {
        border-bottom: 1.5px solid #000;
        margin: 1.5mm 0;
      }

      .vertical-sep {
        width: 0;
        border-right: 1.5px solid #000;
        margin: 0 1mm;
      }

      .code-2d {
        width: 17mm;
        height: 17mm;
        display: block;
      }

      /* Shared metadata table */
      .meta-box {
        border: 1.2px solid #000;
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 3mm;
      }

      .meta-box td {
        border: 1px solid #000;
        padding: 2.5px 5px;
        vertical-align: top;
      }

      .label-col {
        font-weight: bold;
        width: 25mm;
      }

      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <div class="top-bar">
      <h1 class="title-banner">{% block banner_title %}{% endblock %}</h1>
      <div class="top-right">
        <div class="release-info">
          <div>Release 5.0/General/de</div>
          <div class="release-divider"></div>
          <div>{% block release_subtitle %}{% endblock %}</div>
        </div>
        <div class="vertical-sep"></div>
        <img class="code-2d" src="{{ code_2d_uri }}" alt="2D Code" />
      </div>
    </div>

    {% block content %}{% endblock %}
  </body>
</html>
